{% extends "base.html" %}
{% block title %}Редактировать пачку #{{ pack.id }} — WoodFlow{% endblock %}

{% block content %}
<div class="container">
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<h3 class="mb-3">Для отправки</h3>
<div class="row g-3 mb-5">

    <div class="col-md-3">
        <label class="form-label">Номер пачки</label>
        <input type="text" name="number_pac" id="number_pac"
               class="form-control" required
               value="{{ pack.number_pac }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Сорт</label>
        <select name="grade" class="form-select">
            {% for g in ['AA','AB','AC','BB','BC','CC'] %}
            <option {{ "selected" if pack.grade == g }}>{{ g }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-2">
        <label class="form-label">Ширина пачки факт. (мм)</label>
        <input type="number" name="width_fact_for_tam"
               id="width_fact_for_tam"
               class="form-control calc"
               required step="any" min="1"
               value="{{ pack.width_fact_for_tam }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Высота пачки факт. (мм)</label>
        <input type="number" name="thickness_fact_for_tam"
               id="thickness_fact_for_tam"
               class="form-control calc"
               required step="any" min="1"
               value="{{ pack.thickness_fact_for_tam }}">
    </div>

    <div class="col-md-3">
        <label class="form-label">Длина пачки факт. (мм)</label>
        <input type="number" name="length_pack"
               id="length_pack"
               class="form-control calc"
               required step="any" min="1"
               value="{{ pack.length_pack }}">
    </div>

</div>

<!-- ================= ДЛЯ ПОКУПАТЕЛЯ ================= -->
<h3 class="mb-3">Для покупателя</h3>
<div class="row g-3 mb-4">

    <div class="col-md-2">
        <label class="form-label">Ширина доски факт. (мм)</label>
        <input type="number" name="width_fact_for_pok"
               id="width_fact_for_pok"
               class="form-control calc"
               required step="any" min="1"
               list="widthList"
               value="{{ pack.width_fact_for_pok }}">
        <datalist id="widthList">
            <option value="22">
            <option value="32">
            <option value="41">
            <option value="55">
            <option value="67">
            <option value="79">
        </datalist>
    </div>

    <div class="col-md-2">
        <label class="form-label">Высота доски факт. (мм)</label>
        <input type="number" name="thickness_fact_for_pok"
               id="thickness_fact_for_pok"
               class="form-control calc"
               required step="any" min="1"
               value="{{ pack.thickness_fact_for_pok }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Длина доски номин. (м)</label>
        <input type="number" name="length_nominal"
               id="length_nominal"
               class="form-control calc"
               required step="any" min="1"
               value="{{ pack.length_fact }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Длина доски факт. (м)</label>
        <input type="number" name="length_fact"
               id="length_fact"
               class="form-control calc"
               required step="any" min="1"
               value="{{ pack.length_fact }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Кол-во рядов</label>
        <input type="number" name="quantity_layers"
               id="quantity_layers"
               class="form-control calc"
               required min="1"
               value="{{ pack.quantity_layers }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Кол-во столбцов</label>
        <input type="number" name="quantity_in_layer"
               id="quantity_in_layer"
               class="form-control calc"
               required min="1"
               value="{{ pack.quantity_in_layer }}">
    </div>

    <div class="col-md-2">
        <label class="form-label">Общее кол-во</label>
        <input type="number" name="quantity" id="quantity"
               class="form-control" required value="{{ pack.quantity }}">
    </div>

</div>


    <!-- ================= НИЖНИЕ АВТОРАСЧЁТЫ ================= -->
<div class="row g-4 mb-4">

    <div class="col-md-4">
        <label class="form-label text-success">Вес пачки (кг)</label>
        <input type="text" id="weightDisplay"
               class="form-control border-success" readonly>
    </div>

    <div class="col-md-4">
        <label class="form-label text-success">Объём номинальный (м³)</label>
        <input type="text" id="volumeNominalDisplay"
               class="form-control border-success" readonly>
    </div>

    <div class="col-md-4">
        <label class="form-label text-success">Объём фактический (м³)</label>
        <input type="text" id="volumeDisplay"
               class="form-control border-success" readonly>
    </div>

</div>


<div class="mb-4">
    <label class="form-label">Примечания</label>
    <textarea name="notes"
              class="form-control"
              rows="2">{{ pack.notes }}</textarea>
</div>

<button type="submit" class="btn btn-success">
    Сохранить
</button>
<a href="{{ url_for('stock') }}"
   class="btn btn-outline-secondary ms-2">Отмена</a>

</form>
</div>
{% endblock %}
{% block scripts %}
<script>

document.querySelectorAll('.calc').forEach(el=>{
    el.addEventListener('input', calculateAll);
});

window.addEventListener('load', calculateAll);

function calculateAll(){

    // ===== данные покупателя =====
    const wft = parseFloat(document.getElementById('width_fact_for_tam').value) || 0;
    const tft = parseFloat(document.getElementById('thickness_fact_for_tam').value) || 0;
    const l_pack = parseFloat(document.getElementById('length_pack').value) || 0;

    const q1 = parseInt(document.getElementById('quantity_layers').value) || 0;
    const q2 = parseInt(document.getElementById('quantity_in_layer').value) || 0;

    const totalQty = q1 * q2;
    document.getElementById('quantity').value = totalQty > 0 ? totalQty : '';

    // ===== фактический объём для покупателя =====
    const volumeFact = (wft/1000)*(tft/1000)*(l_pack/1000);
    document.getElementById('volumeDisplay').value =
        volumeFact > 0 ? volumeFact.toFixed(4) + ' м³' : '';

    // ===== номинальный объём (по пачке) =====
    const volumeNominal = volumeFact * 0.92;
    document.getElementById('volumeNominalDisplay').value =
        volumeNominal > 0 ? volumeNominal.toFixed(4) + ' м³' : '';

    // ===== вес пачки (плотность 630 кг/м³) факт для таможни =====
    const density = 630;
    const weight = volumeNominal * density;
    document.getElementById('weightDisplay').value =
        weight > 0 ? weight.toFixed(1) + ' кг' : '';
}

</script>
{% endblock %}
