{% extends "base.html" %}
{% block title %}Вход — WoodFlow{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card wf-card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-tree display-3 text-wf-green"></i>
                    <h3 class="mt-2 fw-bold text-wf-green">WoodFlow</h3>
                    <p class="text-muted">Войдите в систему</p>
                </div>
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-wf-green w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
