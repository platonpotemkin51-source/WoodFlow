{% extends "base.html" %}
{% block title %}Новый пользователь — WoodFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-5">
    <h2 class="mb-4"><i class="bi bi-person-plus"></i> Регистрация пользователя</h2>
    <div class="card wf-card">
        <div class="card-body">
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Логин *</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">ФИО</label>
                    <input type="text" name="full_name" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль *</label>
                    <input type="password" name="password" class="form-control" required minlength="4">
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" name="is_admin" class="form-check-input" id="isAdmin">
                    <label class="form-check-label" for="isAdmin">Администратор</label>
                </div>
                <button type="submit" class="btn btn-wf-green">
                    <i class="bi bi-check-lg"></i> Создать
                </button>
                <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary ms-2">Отмена</a>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
